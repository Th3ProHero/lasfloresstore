spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:lasflores}
    username: ${DB_USER:lasflores}
    password: ${DB_PASSWORD:lasflores123}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    defer-datasource-initialization: true
    hibernate:
      # 'validate' verifica que el esquema coincida pero nunca borra ni recrea tablas.
      # Usa 'update' solo si necesitas añadir nuevas columnas automáticamente.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      # 'never' evita que data.sql se ejecute en cada reinicio y duplique datos.
      # Cámbialo a 'always' solo la primera vez o cuando necesites reinicializar datos.
      mode: never
      platform: postgresql

app:
  base-url: ${APP_BASE_URL:https://abarroteslasflores.com}
