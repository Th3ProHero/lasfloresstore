spring:
  application:
    name: lasflores-backend

  # Default profile: H2 in-memory for local dev
  datasource:
    url: jdbc:h2:mem:lasflores
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always

server:
  port: 8080

# Custom properties
app:
  jwt:
    secret: abarrotes-las-flores-jwt-secret-key-2024-super-secure-key-minimum-256-bits
    expiration: 86400000  # 24 hours
  inventory:
    low-stock-threshold: 10
  admin:
    username: admin
    password: lasflores2024

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
